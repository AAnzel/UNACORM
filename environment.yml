name: unacorm_env

channels:
  - conda-forge
  - defaults

dependencies:
  - python
  - build
  - cmake
  - numpy
  - scipy
  - numba
  - requests
  - colorama
  - pandas
  - pillow
  - matplotlib
  - pycryptodomex
  - pytest
  - watchdog
  - streamlit==1.58*
  - plotly
  - bitarray
  - bitstring
  - galois
  - pathos
  - cython

  - pip # Ensure pip is installed in conda environment to handle pip packages.
  - pip:
      - reedsolo==0.3
      - crcmod
      - crccheck
      - progressbar2
      - bcolors
      - cycler
      - pybloom3
      - ninja
      #- pybloomfiltermmap3  # Leave this commented if you use Windows only
